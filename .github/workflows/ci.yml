# Minimal CI for a Vercel-hosted Next.js + LangGraph app.
#
# Vercel handles the production build / preview deploy automatically through
# the GitHub integration — no need for a duplicate "build" job here. We only
# run the cheap, deterministic checks that catch real bugs before they hit
# the preview deploy.
#
# Two jobs:
#   - quality : typecheck + lint (single Node, single install)
#   - tests   : jest unit tests (backend + frontend)
#
# Anything else (pre-commit hooks, codespell, gitleaks, Playwright E2E,
# multi-Node-version matrix) was removed during cleanup. Vercel's preview
# deploy is the integration test.

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: yarn
      - run: yarn install --frozen-lockfile --ignore-scripts
      - run: yarn typecheck
      - run: yarn lint

  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Backend tests
        run: yarn test --passWithNoTests

      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Frontend tests
        working-directory: frontend
        run: pnpm test:ci
