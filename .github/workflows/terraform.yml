# =============================================================================
# Terraform Infrastructure Management
# =============================================================================
# - Plan on PR
# - Apply on merge to main (prod) or specific branches (dev/uat)
#
# Environment Deployment Strategy:
# - Push to develop/main → Dev environment (automatic)
# - UAT and Prod → Manual deployment via workflow_dispatch

name: Terraform

on:
  push:
    branches:
      - main
      - develop
      - uat
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  pull_request:
    branches:
      - main
      - develop
      - uat
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        type: choice
        options:
          - dev
          - uat
          - prod
      action:
        description: "Terraform action"
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy

# Permissions for the workflow
permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  TF_VERSION: "1.6.0"
  ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

jobs:
  # ===========================================================================
  # Check Secrets Availability
  # ===========================================================================
  check-secrets:
    name: Check Secrets Availability
    runs-on: ubuntu-latest
    outputs:
      has-azure-creds: ${{ steps.check.outputs.has-azure-creds }}
    steps:
      - name: Check if Azure credentials are available
        id: check
        env:
          ARM_CLIENT: ${{ secrets.ARM_CLIENT_ID }}
          ARM_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_SUB: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT: ${{ secrets.ARM_TENANT_ID }}
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
        run: |
          missing=()

          [ -z "$ARM_CLIENT" ] && missing+=("ARM_CLIENT_ID")
          [ -z "$ARM_SECRET" ] && missing+=("ARM_CLIENT_SECRET")
          [ -z "$ARM_SUB" ] && missing+=("ARM_SUBSCRIPTION_ID")
          [ -z "$ARM_TENANT" ] && missing+=("ARM_TENANT_ID")
          [ -z "$POSTGRES_PASSWORD" ] && missing+=("POSTGRES_ADMIN_PASSWORD")

          # Require at least one AI provider key
          if [ -z "$GEMINI_KEY" ] && [ -z "$OPENAI_KEY" ]; then
            missing+=("GEMINI_API_KEY or OPENAI_API_KEY")
          fi

          [ -z "$CLERK_PUBLISHABLE_KEY" ] && missing+=("CLERK_PUBLISHABLE_KEY")
          [ -z "$CLERK_SECRET_KEY" ] && missing+=("CLERK_SECRET_KEY")

          if [ ${#missing[@]} -eq 0 ]; then
            echo "has-azure-creds=true" >> $GITHUB_OUTPUT
          else
            echo "has-azure-creds=false" >> $GITHUB_OUTPUT
            echo "::warning::Missing required secrets: ${missing[*]}. Skipping Terraform operations."
          fi

  # ===========================================================================
  # Determine Environment
  # ===========================================================================
  determine-environment:
    name: Determine Environment
    needs: check-secrets
    if: needs.check-secrets.outputs.has-azure-creds == 'true'
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      requires_approval: ${{ steps.set-env.outputs.requires_approval }}
    steps:
      - name: Set environment from branch or input
        id: set-env
        run: |
          REQUIRES_APPROVAL="false"

          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            ENV="${{ github.event.inputs.environment }}"
            if [ "$ENV" == "uat" ] || [ "$ENV" == "prod" ]; then
              REQUIRES_APPROVAL="true"
            fi
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            # Main branch deploys to dev (not prod)
            ENV="dev"
          elif [ "${{ github.ref }}" == "refs/heads/uat" ]; then
            ENV="uat"
            REQUIRES_APPROVAL="true"
          else
            ENV="dev"
          fi

          echo "environment=${ENV}" >> $GITHUB_OUTPUT
          echo "requires_approval=${REQUIRES_APPROVAL}" >> $GITHUB_OUTPUT

  # ===========================================================================
  # Terraform Plan
  # ===========================================================================
  terraform-plan:
    name: Terraform Plan
    needs: determine-environment
    runs-on: ubuntu-latest
    environment: ${{ needs.determine-environment.outputs.environment }}
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: |
          terraform init \
            -upgrade \
            -backend-config="environments/${{ needs.determine-environment.outputs.environment }}.backend.tfvars"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
          LANGCHAIN_KEY: ${{ secrets.LANGCHAIN_API_KEY }}
          SERPER_KEY: ${{ secrets.SERPER_API_KEY }}
          PERPLEXITY_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          FIRECRAWL_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          STRIPE_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_KEY: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          ADMIN_IDS: ${{ secrets.ADMIN_USER_IDS }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
        run: |
          terraform plan \
            -var-file="environments/${{ needs.determine-environment.outputs.environment }}.tfvars" \
            -var="subscription_id=${{ secrets.ARM_SUBSCRIPTION_ID }}" \
            -var="gemini_api_key=${GEMINI_KEY:-}" \
            -var="openai_api_key=${OPENAI_KEY:-}" \
            -var="clerk_publishable_key=${{ secrets.CLERK_PUBLISHABLE_KEY }}" \
            -var="clerk_secret_key=${{ secrets.CLERK_SECRET_KEY }}" \
            -var="langchain_api_key=${LANGCHAIN_KEY:-}" \
            -var="serper_api_key=${SERPER_KEY:-}" \
            -var="perplexity_api_key=${PERPLEXITY_KEY:-}" \
            -var="firecrawl_api_key=${FIRECRAWL_KEY:-}" \
            -var="stripe_secret_key=${STRIPE_KEY:-}" \
            -var="stripe_webhook_secret=${STRIPE_WEBHOOK_KEY:-}" \
            -var="admin_user_ids=${ADMIN_IDS:-}" \
            -var="postgres_admin_password=${POSTGRES_PASSWORD}" \
            -out=tfplan \
            -no-color
        continue-on-error: true

      - name: Post Plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Terraform Plan 📖
            **Environment:** \`${{ needs.determine-environment.outputs.environment }}\`

            <details><summary>Show Plan</summary>

            \`\`\`terraform
            ${{ steps.plan.outputs.stdout }}
            \`\`\`

            </details>

            *Pushed by: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - name: Upload Plan
        if: steps.plan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ needs.determine-environment.outputs.environment }}
          path: terraform/tfplan
          retention-days: 5

      - name: Plan Status
        if: steps.plan.outcome == 'failure'
        run: |
          echo "::error::Terraform plan failed. Check the plan step output above for details."
          echo "Plan stdout:"
          echo "${{ steps.plan.outputs.stdout }}"
          echo "Plan stderr:"
          echo "${{ steps.plan.outputs.stderr }}"
          exit 1

  # ===========================================================================
  # Terraform Apply
  # ===========================================================================
  terraform-apply:
    name: Terraform Apply
    needs: [determine-environment, terraform-plan]
    runs-on: ubuntu-latest
    environment: ${{ needs.determine-environment.outputs.environment }}
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: |
          terraform init \
            -upgrade \
            -backend-config="environments/${{ needs.determine-environment.outputs.environment }}.backend.tfvars"

      - name: Download Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ needs.determine-environment.outputs.environment }}
          path: terraform

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      - name: Get Outputs
        id: outputs
        run: |
          echo "backend_url=$(terraform output -raw backend_url)" >> $GITHUB_OUTPUT
          echo "frontend_url=$(terraform output -raw frontend_url)" >> $GITHUB_OUTPUT
          if terraform output -raw postgresql_server_fqdn 2>/dev/null; then
            echo "postgresql_server=$(terraform output -raw postgresql_server_fqdn)" >> $GITHUB_OUTPUT
          fi
          if terraform output -raw key_vault_name 2>/dev/null; then
            echo "key_vault=$(terraform output -raw key_vault_name)" >> $GITHUB_OUTPUT
          fi

      - name: Deployment Summary
        run: |
          echo "## Terraform Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ needs.determine-environment.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Container Apps" >> $GITHUB_STEP_SUMMARY
          echo "| Service | URL |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | ${{ steps.outputs.outputs.backend_url }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | ${{ steps.outputs.outputs.frontend_url }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Infrastructure" >> $GITHUB_STEP_SUMMARY
          echo "| Resource | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| PostgreSQL Server | ${{ steps.outputs.outputs.postgresql_server }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Key Vault | ${{ steps.outputs.outputs.key_vault }} |" >> $GITHUB_STEP_SUMMARY
